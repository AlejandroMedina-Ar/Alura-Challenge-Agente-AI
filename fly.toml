# fly.toml app configuration file generated for techflow-rag-agent on 2026-07-28T01:07:59-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'techflow-rag-agent'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'

[env]
  LOG_LEVEL = 'INFO'
  PORT = '8501'
  PYTHONDONTWRITEBYTECODE = '1'
  PYTHONUNBUFFERED = '1'
  STREAMLIT_BROWSER_GATHER_USAGE_STATS = 'false'
  STREAMLIT_SERVER_ADDRESS = '0.0.0.0'
  STREAMLIT_SERVER_ENABLE_CORS = 'false'
  STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION = 'true'
  STREAMLIT_SERVER_HEADLESS = 'true'
  STREAMLIT_SERVER_PORT = '8501'

[[mounts]]
  source = 'techflow_data'
  destination = '/app/data'
  initial_size = '3gb'

[[services]]
  protocol = 'tcp'
  internal_port = 8501
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 40

  [[services.http_checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/_stcore/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[metrics]]
  port = 9091
  path = '/metrics'
